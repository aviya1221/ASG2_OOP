<h1>פתרון מטלה 2 במבוא לפסיכולוגיה חברתית</h1>

<h2>שאלה 1</h2>
<p><b>א.</b> זה ניסוי שבו אנשים נתנו מכות חשמל כי החוקר אמר להם.</p>
<p><b>ב.</b> נורמטיבי זה דבר נורמלי, ואינפורמטיבי זה מידע.</p>

<h2>שאלה 2</h2>
<p><b>א.</b> היא ביישנית ולכן לא מדברת.</p>
<p><b>ב.</b> לדבר יותר ולהיות נחמדים.</p>

<h2>שאלה 3</h2>
<p>הניסוי היה לפני הרבה זמן.</p>
